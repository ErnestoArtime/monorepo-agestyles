name: Monorepo checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agestyles_lab
          POSTGRES_PASSWORD: 0123456789abcdef
          POSTGRES_DB: agestyles_mercur_lab
        ports:
          - 15472:5432
        options: >-
          --health-cmd "pg_isready -U agestyles_lab -d agestyles_mercur_lab"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 16392:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace sources
        run: pnpm lint

      - name: Check formatting of changed files
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Type-check the API, application, and shared client
        run: pnpm typecheck

      - name: Create disposable container build configuration
        id: api-build-env
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          cookie_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${db_password}"
          echo "::add-mask::${jwt_secret}"
          echo "::add-mask::${cookie_secret}"
          {
            printf 'DATABASE_URL=postgres://agestyles_lab:%s@127.0.0.1:15472/agestyles_mercur_lab\n' "${db_password}"
            printf 'REDIS_URL=redis://127.0.0.1:16392\n'
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'COOKIE_SECRET=%s\n' "${cookie_secret}"
          } > "${env_file}"
          echo "path=${env_file}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Commerce API runtime image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/commerce-api/Dockerfile.public
          push: false
          load: true
          tags: agestyles/commerce-api:ci
          secret-files: |
            lab_env=${{ steps.api-build-env.outputs.path }}

      - name: Migrate disposable PostgreSQL for API smoke test
        env:
          DATABASE_URL: postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab
          REDIS_URL: redis://127.0.0.1:16392
          JWT_SECRET: ci_jwt_0123456789abcdef0123456789abcdef
          COOKIE_SECRET: ci_cookie_0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env DATABASE_URL --env REDIS_URL --env JWT_SECRET --env COOKIE_SECRET \
            agestyles/commerce-api:ci pnpm migrate

      - name: Seed disposable marketplace for seller permission checks
        env:
          DATABASE_URL: postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab
          REDIS_URL: redis://127.0.0.1:16392
          JWT_SECRET: ci_jwt_0123456789abcdef0123456789abcdef
          COOKIE_SECRET: ci_cookie_0123456789abcdef0123456789abcdef
          AGESTYLES_LAB_SEEDED_PASSWORD: ci_lab_password_0123456789
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env DATABASE_URL --env REDIS_URL --env JWT_SECRET --env COOKIE_SECRET \
            --env AGESTYLES_LAB_SEEDED_PASSWORD \
            agestyles/commerce-api:ci pnpm seed

      - name: Export disposable publishable key for HTTP role checks
        run: |
          set -euo pipefail
          key="$(docker run --rm --network host postgres:17-alpine \
            psql 'postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab' \
            --no-psqlrc --tuples-only --no-align \
            --command "SELECT token FROM api_key WHERE type = 'publishable' AND revoked_at IS NULL ORDER BY created_at LIMIT 1")"
          if [[ ! "${key}" =~ ^pk_[a-zA-Z0-9]+$ ]]; then
            echo "Could not obtain a publishable key from the disposable seed." >&2
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY=${key}" >> "${GITHUB_ENV}"

      - name: Start API and verify health and tracking authentication
        run: |
          set -euo pipefail
          docker run -d --name agestyles-commerce-api-ci --network host \
            --env DATABASE_URL=postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab \
            --env REDIS_URL=redis://127.0.0.1:16392 \
            --env JWT_SECRET=ci_jwt_0123456789abcdef0123456789abcdef \
            --env COOKIE_SECRET=ci_cookie_0123456789abcdef0123456789abcdef \
            agestyles/commerce-api:ci
          health_status="000"
          for attempt in $(seq 1 90); do
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:19081/health || true)"
            if [[ "${health_status}" == "200" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "${health_status}" != "200" ]]; then
            echo "Expected API health endpoint to return HTTP 200; got ${health_status}." >&2
            docker logs agestyles-commerce-api-ci
            exit 1
          fi
          tracking_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:19081/store/orders/order_ci_synthetic/tracking)"
          if [[ "${tracking_status}" != "400" ]]; then
            echo "Expected order-tracking request without a publishable key to be rejected with HTTP 400; got ${tracking_status}." >&2
            docker logs agestyles-commerce-api-ci
            exit 1
          fi
          exit 0

      - name: Create isolated multi-store role fixtures over HTTP
        env:
          EXPO_PUBLIC_MEDUSA_URL: http://127.0.0.1:19081
          AGESTYLES_LAB_SEEDED_PASSWORD: ci_lab_password_0123456789
        run: node tools/scripts/verify-multistore-memberships.mjs

      - name: Approve synthetic CI seller accounts
        env:
          DATABASE_URL: postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab
          REDIS_URL: redis://127.0.0.1:16392
          JWT_SECRET: ci_jwt_0123456789abcdef0123456789abcdef
          COOKIE_SECRET: ci_cookie_0123456789abcdef0123456789abcdef
        run: |
          docker run --rm --network host \
            --env DATABASE_URL --env REDIS_URL --env JWT_SECRET --env COOKIE_SECRET \
            agestyles/commerce-api:ci \
            pnpm exec medusa exec ./src/scripts/approve-lab-sellers.ts

      - name: Seed synthetic offers and inventory for seller role checks
        env:
          DATABASE_URL: postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab
          REDIS_URL: redis://127.0.0.1:16392
          JWT_SECRET: ci_jwt_0123456789abcdef0123456789abcdef
          COOKIE_SECRET: ci_cookie_0123456789abcdef0123456789abcdef
        run: |
          docker run --rm --network host \
            --env DATABASE_URL --env REDIS_URL --env JWT_SECRET --env COOKIE_SECRET \
            agestyles/commerce-api:ci \
            pnpm exec medusa exec ./src/scripts/seed-lab-multistore-offers.ts

      - name: Verify seller roles and cross-store denials over HTTP
        env:
          EXPO_PUBLIC_MEDUSA_URL: http://127.0.0.1:19081
          AGESTYLES_LAB_SEEDED_PASSWORD: ci_lab_password_0123456789
        run: node apps/commerce-api/scripts/verify-seller-roles.mjs

      - name: Verify mixed-seller checkout and buyer order ownership over HTTP
        env:
          EXPO_PUBLIC_MEDUSA_URL: http://127.0.0.1:19081
          AGESTYLES_CI_DISPOSABLE: "true"
          DATABASE_URL: postgres://agestyles_lab:0123456789abcdef@127.0.0.1:15472/agestyles_mercur_lab
        run: node apps/commerce-api/scripts/verify-mixed-checkout-buyer-ownership.mjs

      - name: Verify variant removal permissions over HTTP on disposable data
        env:
          EXPO_PUBLIC_MEDUSA_URL: http://127.0.0.1:19081
          AGESTYLES_LAB_SEEDED_PASSWORD: ci_lab_password_0123456789
          AGESTYLES_CI_DISPOSABLE: "true"
        run: node apps/commerce-api/scripts/verify-variant-removal.mjs

      - name: Verify seller gateway only permits the variant-removal preflight
        run: |
          set -euo pipefail
          node tools/scripts/seller-lab-gateway.mjs >/tmp/agestyles-seller-gateway-ci.log 2>&1 &
          gateway_pid=$!
          trap 'kill "${gateway_pid}" 2>/dev/null || true; wait "${gateway_pid}" 2>/dev/null || true' EXIT
          ready_status="000"
          for attempt in $(seq 1 20); do
            ready_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:19183/healthz || true)"
            if [[ "${ready_status}" == "200" ]]; then break; fi
            sleep 1
          done
          if [[ "${ready_status}" != "200" ]]; then
            cat /tmp/agestyles-seller-gateway-ci.log
            echo "Seller gateway did not become ready." >&2
            exit 1
          fi
          delete_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS http://127.0.0.1:19183/agestyles-seller/vendor/products/prod_ci_1/variants/variant_ci_1 \
            --header 'Origin: https://negocio.eav-labs.com' \
            --header 'Access-Control-Request-Method: DELETE')"
          post_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS http://127.0.0.1:19183/agestyles-seller/vendor/products/prod_ci_1/variants/variant_ci_1 \
            --header 'Origin: https://negocio.eav-labs.com' \
            --header 'Access-Control-Request-Method: POST')"
          if [[ "${delete_status}" != "204" || "${post_status}" != "403" ]]; then
            echo "Expected variant DELETE preflight 204 and unsupported POST 403; got ${delete_status}/${post_status}." >&2
            cat /tmp/agestyles-seller-gateway-ci.log
            exit 1
          fi

      - name: Stop disposable Commerce API smoke test
        if: always()
        run: docker rm --force agestyles-commerce-api-ci || true

      - name: Remove disposable container build configuration
        if: always()
        env:
          ENV_FILE: ${{ steps.api-build-env.outputs.path }}
        run: |
          if [[ -n "${ENV_FILE}" ]]; then rm -f -- "${ENV_FILE}"; fi

      - name: Export buyer app for web
        env:
          EXPO_PUBLIC_MEDUSA_URL: https://ci.invalid
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder
        run: pnpm --filter @agestyles/buyer-app exec expo export --platform web --output-dir /tmp/agestyles-ci-buyer-web

      - name: Export business app for web
        env:
          EXPO_PUBLIC_MEDUSA_URL: https://ci.invalid
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder
        run: pnpm --filter @agestyles/business-app exec expo export --platform web --output-dir /tmp/agestyles-ci-business-web

      - name: Build the SEO storefront
        run: pnpm nx build @agestyles/storefront-web
