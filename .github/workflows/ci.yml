name: Monorepo checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace sources
        run: pnpm lint

      - name: Check formatting of changed files
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Type-check the API, application, and shared client
        run: pnpm typecheck

      - name: Build isolated Medusa server
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          cookie_secret="$(openssl rand -hex 32)"
          export DATABASE_URL="postgres://agestyles_lab:${db_password}@127.0.0.1:15472/agestyles_mercur_lab"
          export REDIS_URL="redis://127.0.0.1:16392"
          export JWT_SECRET="${jwt_secret}"
          export COOKIE_SECRET="${cookie_secret}"
          echo "::add-mask::${DATABASE_URL}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${COOKIE_SECRET}"
          pnpm --filter @agestyles/commerce-api build

      - name: Export buyer app for web
        env:
          EXPO_PUBLIC_MEDUSA_URL: https://ci.invalid
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder
        run: pnpm --filter @agestyles/buyer-app exec expo export --platform web --output-dir /tmp/agestyles-ci-buyer-web

      - name: Export business app for web
        env:
          EXPO_PUBLIC_MEDUSA_URL: https://ci.invalid
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder
        run: pnpm --filter @agestyles/business-app exec expo export --platform web --output-dir /tmp/agestyles-ci-business-web

      - name: Build the SEO storefront
        run: pnpm nx build @agestyles/storefront-web
