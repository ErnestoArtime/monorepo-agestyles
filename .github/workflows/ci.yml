name: Monorepo checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace sources
        run: pnpm lint

      - name: Check formatting of changed files
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Type-check the API, application, and shared client
        run: pnpm typecheck

      - name: Create disposable container build configuration
        id: api-build-env
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          cookie_secret="$(openssl rand -hex 32)"
          {
            printf 'DATABASE_URL=postgres://agestyles_lab:%s@127.0.0.1:15472/agestyles_mercur_lab\n' "${db_password}"
            printf 'REDIS_URL=redis://127.0.0.1:16392\n'
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'COOKIE_SECRET=%s\n' "${cookie_secret}"
          } > "${env_file}"
          echo "path=${env_file}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Commerce API runtime image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/commerce-api/Dockerfile.public
          push: false
          tags: agestyles/commerce-api:ci
          secret-files: |
            lab_env=${{ steps.api-build-env.outputs.path }}

      - name: Remove disposable container build configuration
        if: always()
        env:
          ENV_FILE: ${{ steps.api-build-env.outputs.path }}
        run: |
          if [[ -n "${ENV_FILE}" ]]; then rm -f -- "${ENV_FILE}"; fi

      - name: Export buyer app for web
        env:
          EXPO_PUBLIC_MEDUSA_URL: https://ci.invalid
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder
        run: pnpm --filter @agestyles/buyer-app exec expo export --platform web --output-dir /tmp/agestyles-ci-buyer-web

      - name: Export business app for web
        env:
          EXPO_PUBLIC_MEDUSA_URL: https://ci.invalid
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: pk_ci_placeholder
        run: pnpm --filter @agestyles/business-app exec expo export --platform web --output-dir /tmp/agestyles-ci-business-web

      - name: Build the SEO storefront
        run: pnpm nx build @agestyles/storefront-web
