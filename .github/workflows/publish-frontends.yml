name: Publish frontend images

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-frontends
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4

      - name: Require successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=50")"
          successful_runs="$(jq --arg sha "${GITHUB_SHA}" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length' <<<"${response}")"
          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "No successful Monorepo checks run exists for this exact main commit." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public build variables
        env:
          GHCR_OWNER: ${{ vars.AGESTYLES_GHCR_OWNER }}
          BUYER_MEDUSA_URL: ${{ vars.AGESTYLES_BUYER_MEDUSA_URL }}
          BUSINESS_MEDUSA_URL: ${{ vars.AGESTYLES_BUSINESS_MEDUSA_URL }}
          STOREFRONT_MEDUSA_URL: ${{ vars.AGESTYLES_STOREFRONT_MEDUSA_URL }}
          MEDUSA_PUBLISHABLE_KEY: ${{ vars.AGESTYLES_MEDUSA_PUBLISHABLE_KEY }}
          BUYER_APP_URL: ${{ vars.AGESTYLES_BUYER_APP_URL }}
          STOREFRONT_SITE_URL: ${{ vars.AGESTYLES_STOREFRONT_SITE_URL }}
        run: |
          set -euo pipefail
          for name in GHCR_OWNER BUYER_MEDUSA_URL BUSINESS_MEDUSA_URL STOREFRONT_MEDUSA_URL MEDUSA_PUBLISHABLE_KEY BUYER_APP_URL STOREFRONT_SITE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository variable: AGESTYLES_${name} (see docs/runbooks/manual-frontend-publish.md)." >&2
              exit 1
            fi
          done
          if [[ ! "${GHCR_OWNER}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "AGESTYLES_GHCR_OWNER must be the lowercase user or organization name in GitHub Container Registry." >&2
            exit 1
          fi
          if [[ "${MEDUSA_PUBLISHABLE_KEY}" != pk_* ]]; then
            echo "AGESTYLES_MEDUSA_PUBLISHABLE_KEY must be a public Medusa publishable key." >&2
            exit 1
          fi

      - name: Export buyer web bundle
        env:
          EXPO_PUBLIC_MEDUSA_URL: ${{ vars.AGESTYLES_BUYER_MEDUSA_URL }}
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: ${{ vars.AGESTYLES_MEDUSA_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_ANDROID_APK_URL: ${{ vars.AGESTYLES_BUYER_ANDROID_APK_URL }}
          EXPO_NO_TELEMETRY: "1"
        run: pnpm --filter @agestyles/buyer-app exec expo export --platform web

      - name: Export business web bundle
        env:
          BUSINESS_WEB_MEDUSA_URL: ${{ vars.AGESTYLES_BUSINESS_MEDUSA_URL }}
          EXPO_PUBLIC_MEDUSA_PUBLISHABLE_API_KEY: ${{ vars.AGESTYLES_MEDUSA_PUBLISHABLE_KEY }}
          EXPO_NO_TELEMETRY: "1"
        run: node tools/scripts/build-business-web.mjs

      - name: Build SEO storefront standalone output
        env:
          MEDUSA_BACKEND_URL: ${{ vars.AGESTYLES_STOREFRONT_MEDUSA_URL }}
          MEDUSA_PUBLISHABLE_API_KEY: ${{ vars.AGESTYLES_MEDUSA_PUBLISHABLE_KEY }}
          BUYER_APP_URL: ${{ vars.AGESTYLES_BUYER_APP_URL }}
          SITE_URL: ${{ vars.AGESTYLES_STOREFRONT_SITE_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm nx build @agestyles/storefront-web

      - name: Create unique SHA image tag
        id: image-tag
        run: |
          tag="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
          echo "Published image tag: ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish buyer runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/buyer-app
          file: ./apps/buyer-app/Dockerfile.web-runtime
          push: true
          tags: ghcr.io/${{ vars.AGESTYLES_GHCR_OWNER }}/agestyles-buyer-web:${{ steps.image-tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AgeStyles buyer web

      - name: Publish business runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/business-app
          file: ./apps/business-app/Dockerfile.web-runtime
          push: true
          tags: ghcr.io/${{ vars.AGESTYLES_GHCR_OWNER }}/agestyles-business-web:${{ steps.image-tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AgeStyles business web

      - name: Publish storefront runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/storefront-web
          file: ./apps/storefront-web/Dockerfile.runtime
          push: true
          tags: ghcr.io/${{ vars.AGESTYLES_GHCR_OWNER }}/agestyles-storefront-web:${{ steps.image-tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AgeStyles SEO storefront
