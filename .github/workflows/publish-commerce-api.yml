name: Publish commerce API image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Monorepo checks"]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-commerce-api
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Require successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=50")"
          successful_runs="$(jq --arg sha "${RELEASE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length' <<<"${response}")"
          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "No successful Monorepo checks run exists for this exact main commit." >&2
            exit 1
          fi

      - name: Resolve GHCR owner
        id: registry
        env:
          GHCR_OWNER: ${{ vars.AGESTYLES_GHCR_OWNER }}
        run: |
          set -euo pipefail
          owner="${GHCR_OWNER:-${GITHUB_REPOSITORY_OWNER,,}}"
          if [[ ! "${owner}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "AGESTYLES_GHCR_OWNER must be a lowercase GitHub owner." >&2
            exit 1
          fi
          echo "image=ghcr.io/${owner}/agestyles-commerce-api" >> "${GITHUB_OUTPUT}"

      - name: Create disposable build-time configuration
        id: build-env
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          cookie_secret="$(openssl rand -hex 32)"
          {
            printf 'DATABASE_URL=postgres://agestyles_lab:%s@127.0.0.1:15472/agestyles_mercur_lab\n' "${db_password}"
            printf 'REDIS_URL=redis://127.0.0.1:16392\n'
            printf 'JWT_SECRET=%s\n' "${jwt_secret}"
            printf 'COOKIE_SECRET=%s\n' "${cookie_secret}"
          } > "${env_file}"
          echo "path=${env_file}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create unique SHA image tag
        id: image-tag
        run: |
          tag="sha-${RELEASE_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish commerce API runtime image
        id: publish-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/commerce-api/Dockerfile.public
          push: true
          tags: ${{ steps.registry.outputs.image }}:${{ steps.image-tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.title=AgeStyles Commerce API
          secret-files: |
            lab_env=${{ steps.build-env.outputs.path }}

      - name: Record published image
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          DIGEST: ${{ steps.publish-image.outputs.digest }}
          TAG: ${{ steps.image-tag.outputs.value }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Imagen para producción: `%s@%s`\n\nEtiqueta: `%s`\n' "${IMAGE}" "${DIGEST}" "${TAG}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove disposable build-time configuration
        if: always()
        env:
          ENV_FILE: ${{ steps.build-env.outputs.path }}
        run: |
          if [[ -n "${ENV_FILE}" ]]; then rm -f -- "${ENV_FILE}"; fi
