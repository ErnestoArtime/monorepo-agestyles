# Public product photos written by the Commerce API local file provider (AG-26).
# Only flat image names are served; private uploads and any other path return 404.
server {
    listen 127.0.0.1:19088;
    server_tokens off;

    location / {
        return 404;
    }

    location ~ ^/agestyles-product-media/([0-9]+-[a-zA-Z0-9_-][a-zA-Z0-9_.-]*\.(?:avif|gif|jpe?g|png|webp))$ {
        limit_except GET {
            deny all;
        }
        alias /srv/media/$1;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
