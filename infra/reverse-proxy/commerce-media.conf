server {
    listen 127.0.0.1:19087;
    server_tokens off;

    location / {
        return 404;
    }

    location ~ ^/agestyles-product-media/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*\.(avif|gif|jpe?g|png|webp)$ {
        if ($request_uri !~ "^/agestyles-product-media/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*\.(avif|gif|jpe?g|png|webp)$") {
            return 404;
        }
        limit_except GET {
            deny all;
        }
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:19086;
    }
}
