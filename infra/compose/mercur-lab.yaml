name: agestyles-mercur-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agestyles_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the lab env file}
      POSTGRES_DB: agestyles_mercur_lab
    ports:
      - "127.0.0.1:15472:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agestyles_lab -d agestyles_mercur_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16392:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 128m

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["media"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:19083:9000"
      - "127.0.0.1:19084:9001"
    volumes:
      - minio-data:/data
    mem_limit: 512m

  minio-bucket:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["media"]
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-agestyles-media}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set lab http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc ready lab; do sleep 2; done;
        mc mb --ignore-existing "lab/$${S3_BUCKET}";
        mc anonymous set download "lab/$${S3_BUCKET}"
    restart: "no"
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
  minio-data:
