name: agestyles-mercur-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agestyles_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the lab env file}
      POSTGRES_DB: agestyles_mercur_lab
    ports:
      - "127.0.0.1:15472:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agestyles_lab -d agestyles_mercur_lab"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16392:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
