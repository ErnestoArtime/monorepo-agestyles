name: agestyles-commerce-production

services:
  commerce-api:
    image: ${AGESTYLES_PRODUCTION_IMAGE:?Set the production Commerce API image}
    network_mode: host
    env_file:
      - ${AGESTYLES_PRODUCTION_API_ENV_FILE:?Set the path to the private production API env file}
    environment:
      AGESTYLES_COMMERCE_ENV: production
      REDIS_URL: redis://127.0.0.1:16393
    command: ["pnpm", "exec", "medusa", "start", "--host", "127.0.0.1", "--port", "19085"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19085/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  buyer-gateway:
    image: node:24-bookworm-slim
    network_mode: host
    working_dir: /app
    command: ["node", "/app/buyer-gateway.mjs"]
    environment:
      GATEWAY_PREFIX: ""
      GATEWAY_PORT: "19186"
      UPSTREAM_PORT: "19085"
      ALLOWED_ORIGINS: https://tienda.eav-labs.com,https://catalogo.eav-labs.com
    volumes:
      - ../../tools/scripts/buyer-lab-gateway.mjs:/app/buyer-gateway.mjs:ro
    depends_on:
      commerce-api:
        condition: service_healthy
    restart: unless-stopped

  seller-gateway:
    image: node:24-bookworm-slim
    network_mode: host
    working_dir: /app
    command: ["node", "/app/seller-gateway.mjs"]
    environment:
      GATEWAY_PREFIX: /negocio
      GATEWAY_PORT: "19187"
      UPSTREAM_PORT: "19085"
      ALLOWED_ORIGINS: https://negocio.eav-labs.com
    volumes:
      - ../../tools/scripts/seller-lab-gateway.mjs:/app/seller-gateway.mjs:ro
    depends_on:
      commerce-api:
        condition: service_healthy
    restart: unless-stopped

  media-public:
    profiles: ["local-media"]
    image: nginx:1.28.0-alpine
    network_mode: host
    volumes:
      - ../reverse-proxy/commerce-media.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - media
    restart: unless-stopped

  media:
    profiles: ["local-media"]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${AGESTYLES_PRODUCTION_MINIO_USER:-}
      MINIO_ROOT_PASSWORD: ${AGESTYLES_PRODUCTION_MINIO_PASSWORD:-}
      MINIO_BROWSER: "off"
    entrypoint:
      [
        "/bin/sh",
        "-ec",
        'test -n "$$MINIO_ROOT_USER" && test -n "$$MINIO_ROOT_PASSWORD" && exec minio server /data',
      ]
    ports:
      - "127.0.0.1:19086:9000"
    volumes:
      - media-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agestyles_production
      POSTGRES_PASSWORD: ${AGESTYLES_PRODUCTION_POSTGRES_PASSWORD:?Set the production database password}
      POSTGRES_DB: agestyles_commerce
    ports:
      - "127.0.0.1:15473:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agestyles_production", "-d", "agestyles_commerce"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16393:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  media-data:
