name: agestyles-storefront-web

services:
  storefront-web:
    build:
      context: ../../apps/storefront-web
      dockerfile: Dockerfile.runtime
    image: agestyles/storefront-web:local
    container_name: agestyles-storefront-web
    restart: unless-stopped
    env_file:
      - ../../.env.storefront-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:18084:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
